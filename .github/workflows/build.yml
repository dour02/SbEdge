name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Build release APK
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk SbEdge-${{ github.run_number }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SbEdge-${{ github.run_number }}
          path: SbEdge-${{ github.run_number }}.apk

      # 每次构建发布一个 Release，手机浏览器可以直接下载 APK
      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          gh release create "$tag" "SbEdge-${{ github.run_number }}.apk" \
            --target "${{ github.sha }}" --title "SbEdge $tag" --notes "Automated build of ${{ github.sha }}"
